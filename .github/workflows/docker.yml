name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/ss26-se2-codenames/backend:latest .
          docker build -t ghcr.io/ss26-se2-codenames/backend:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ghcr.io/ss26-se2-codenames/backend:latest
          docker push ghcr.io/ss26-se2-codenames/backend:${{ github.sha }}